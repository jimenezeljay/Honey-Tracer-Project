<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html"><span class="brand-mark"><img src="images/honey-tracker-logo.png" alt="" class="brand-logo"></span> Honey Tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="marketplace.html">Marketplace</a></li>
          <li class="nav-item"><a class="nav-link" href="learn.html">Learn</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" href="signin.html">Sign in</a>
          <a class="btn btn-primary" href="get-started.html">Get started</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="panel">
          <h1 class="h2 mb-4">Welcome back</h1>
          <!-- Not connected yet. Backend will handle hashed passwords and roles
               (consumer / beekeeper / volunteer / admin) in a separate, protected login table. -->
          <form>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="mb-2">
              <label class="form-label" for="password">Password</label>
              <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <p class="mb-4"><a href="#">Forgot password?</a></p>
            <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
          </form>
          <p class="mt-4 mb-0 text-center">New here? <a href="get-started.html">Get started</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer mt-5">
    <div class="container py-4 d-flex flex-wrap gap-3 justify-content-between">
      <span>&copy; 2026 Honey Tracker</span>
      <nav class="d-flex flex-wrap gap-3" aria-label="Footer">
        <a href="#">About</a>
        <a href="learn.html">Learn</a>
        <a href="get-started.html">Become a keeper</a>
        <a href="volunteer.html">Volunteer</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </footer>

  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
</body>
</html>
