<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="panel">
          <h1 class="h2 mb-4">Welcome back</h1>
          <!-- Not connected yet. Backend will handle hashed passwords and roles
               (consumer / beekeeper / volunteer / admin) in a separate, protected login table. -->
          <form>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="mb-2">
              <label class="form-label" for="password">Password</label>
              <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <p class="mb-4"><a href="#">Forgot password?</a></p>
            <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
          </form>
          <p class="mt-4 mb-0 text-center">New here? <a href="get-started.html">Get started</a></p>
        </div>
      </div>
    </div>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
</body>
</html>
