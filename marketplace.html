<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace | Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav" data-active="marketplace"></div>

  <main class="container market">
    <!-- Wireframe 4: title and sort on top, filters on the left, card grid on the right.
         Below lg the filters move into a slide-in panel opened by the Filters button (wireframe 17). -->
    <header class="market-head">
      <div>
        <h1 class="mb-1">Marketplace</h1>
        <p class="text-soft mb-0">Certified honey, traced to the hive.</p>
      </div>

      <div class="market-tools">
        <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterPanel" aria-controls="filterPanel">
          <i class="bi bi-sliders" aria-hidden="true"></i> Filters <span class="badge text-bg-primary ms-1 d-none" id="filterCount"></span>
        </button>
        <div class="market-sort">
          <label class="form-label mb-0 text-soft" for="sortSelect">Sort</label>
          <select class="form-select" id="sortSelect" name="sort" form="filterForm">
            <option value="nearest">Nearest to me</option>
            <option value="price">Lowest price</option>
            <option value="newest">Newest harvest</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Shown only while sorting by distance -->
    <p class="market-near text-soft small" id="nearNote" hidden>
      <i class="bi bi-geo-alt" aria-hidden="true"></i>
      Nearest to <span id="nearPlace">Steubenville, OH</span>.
      <button type="button" class="btn btn-link btn-sm p-0 align-baseline" id="useLocation">Use my location</button>
    </p>

    <div class="row g-4">
      <!-- Filters: inline column on lg+, slide-in panel below lg -->
      <div class="col-lg-3">
        <div class="offcanvas-lg offcanvas-start filter-panel" tabindex="-1" id="filterPanel" aria-labelledby="filterPanelLabel">
          <div class="offcanvas-header">
            <h2 class="offcanvas-title h5" id="filterPanelLabel">Filters</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filterPanel" aria-label="Close filters"></button>
          </div>

          <div class="offcanvas-body">
            <form id="filterForm" class="filter-form" aria-label="Filter honey">
              <div class="filter-group">
                <label class="form-label" for="typeSelect">Honey type</label>
                <select class="form-select" id="typeSelect" name="type">
                  <option value="">All types</option>
                </select>
              </div>

              <div class="filter-group">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="verifiedOnly" name="verified" value="1">
                  <label class="form-check-label" for="verifiedOnly">Volunteer-Verified only</label>
                </div>
              </div>

              <fieldset class="filter-group">
                <legend class="form-label">Badges</legend>
                <div id="badgeChecks"></div>
              </fieldset>

              <div class="filter-group">
                <label class="form-label" for="stateSelect">Region / state</label>
                <select class="form-select" id="stateSelect" name="state">
                  <option value="">All states</option>
                </select>
              </div>

              <fieldset class="filter-group">
                <legend class="form-label">Price range</legend>
                <div class="price-range">
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input class="form-control" type="number" id="priceMin" name="min" min="0" step="1" placeholder="Min" aria-label="Minimum price">
                  </div>
                  <span class="text-soft" aria-hidden="true">to</span>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input class="form-control" type="number" id="priceMax" name="max" min="0" step="1" placeholder="Max" aria-label="Maximum price">
                  </div>
                </div>
              </fieldset>

              <div class="filter-group">
                <label class="form-label" for="seasonSelect">Season harvested</label>
                <select class="form-select" id="seasonSelect" name="season">
                  <option value="">Any season</option>
                </select>
              </div>

              <div class="filter-actions">
                <button class="btn btn-primary d-lg-none" type="button" data-bs-dismiss="offcanvas" data-bs-target="#filterPanel" id="showResults">Show results</button>
                <button class="btn btn-link" type="reset" id="clearFilters">Clear filters</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Results -->
      <section class="col-lg-9" aria-labelledby="resultCount">
        <p class="visually-hidden" id="resultCount" aria-live="polite"></p>
        <div class="row g-3" id="listingGrid"></div>

        <!-- No matches -->
        <div class="empty-state" id="noResults" hidden>
          <i class="bi bi-funnel empty-icon" aria-hidden="true"></i>
          <h2 class="h3 mt-3">No honey matches</h2>
          <p class="lead">Try fewer filters.</p>
          <button class="btn btn-primary" type="button" id="clearFromEmpty">Clear filters</button>
        </div>
      </section>
    </div>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
  <script src="js/data.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
