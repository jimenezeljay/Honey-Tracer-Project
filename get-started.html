<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get started · Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav"></div>

  <main class="container py-5">
    <h1 class="mb-5">How do you want to start?</h1>
    <div class="row g-4">
      <div class="col-md-6">
        <div class="choice-card">
          <div class="choice-icon" aria-hidden="true"><i class="bi bi-search"></i></div>
          <h2>Browse honey</h2>
          <p>Certified honey near you. No account needed.</p>
          <a class="btn btn-primary" href="map.html">Explore</a>
        </div>
      </div>
      <div class="col-md-6">
        <div class="choice-card">
          <div class="choice-icon" aria-hidden="true"><i class="bi bi-hexagon"></i></div>
          <h2>Beekeepers</h2>
          <p>Register hives, log harvests, sell honey.</p>
          <a class="btn btn-outline-secondary" href="signin.html">Join</a>
        </div>
      </div>
    </div>
    <p class="mt-4"><a href="volunteer.html">Volunteer sign in</a></p>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
</body>
</html>
