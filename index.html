<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="images/honey-tracker-logo.png" alt="" class="brand-logo"> Honey Tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="marketplace.html">Marketplace</a></li>
          <li class="nav-item"><a class="nav-link" href="learn.html">Learn</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" href="signin.html">Sign in</a>
          <a class="btn btn-primary" href="get-started.html">Get started</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Two homepage layouts for the customer to compare (WK8 review).
       A = map beside the headline (current build). B = photo beside the headline, map below (wireframe).
       Pick with ?layout=a or ?layout=b, or the switch in the corner. Remove the switch once one is chosen. -->
  <main class="container home-hero" data-layout="a">
    <div class="home-grid">
      <div class="home-copy">
        <h1 class="mb-4">Honey you can trust.</h1>
        <p class="lead mb-4">We trace every jar back to its hive.</p>
        <!-- Temporary: points to No data found until search is wired up; switch back to map.html later -->
        <a class="btn btn-primary btn-lg" href="not-found.html">Find your honey</a>
      </div>

      <!-- Layout B only -->
      <figure class="home-photo">
        <img src="images/keeper-hive.jpg" alt="Two beekeepers holding a honeycomb frame beside their hives" width="1400" height="1400">
      </figure>

      <div class="home-map">
        <!-- Placeholder map until the mapping provider is chosen.
             map-pin = exact hive location; map-area = approximate area the keeper chose to share. -->
        <div class="map-box" role="img" aria-label="Map of certified hives">
          <form class="map-search" role="search">
            <label class="visually-hidden" for="mapSearch">Search this map</label>
            <input class="form-control" id="mapSearch" type="search" placeholder="Search this map">
          </form>
          <span class="map-pin" style="left: 62%; top: 38%" title="Sunrise Farm"></span>
          <span class="map-area" style="left: 38%; top: 55%" title="Maple Ridge Apiary"></span>
          <span class="map-pin" style="left: 78%; top: 66%" title="Clover Hill"></span>
          <div class="map-legend">
            <span><i class="key-pin"></i>Exact hive</span>
            <span><i class="key-area"></i>Approximate area</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Temporary layout switch for the customer review -->
  <div class="layout-switch btn-group btn-group-sm" role="group" aria-label="Homepage layout preview">
    <button type="button" class="btn btn-light" data-layout-choice="a" aria-pressed="true">Layout A</button>
    <button type="button" class="btn btn-light" data-layout-choice="b" aria-pressed="false">Layout B</button>
  </div>

  <footer class="site-footer mt-5">
    <div class="container py-4 d-flex flex-wrap gap-3 justify-content-between">
      <span>&copy; 2026 Honey Tracker</span>
      <nav class="d-flex flex-wrap gap-3" aria-label="Footer">
        <a href="#">About</a>
        <a href="learn.html">Learn</a>
        <a href="get-started.html">Become a keeper</a>
        <a href="volunteer.html">Volunteer</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </footer>

  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
  <script src="js/home-layout.js"></script>
</body>
</html>
