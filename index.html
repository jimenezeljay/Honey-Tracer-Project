<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav"></div>

  <main class="container home-hero">
    <div class="home-grid">
      <div class="home-copy">
        <h1 class="mb-4">Honey you can trust.</h1>
        <p class="lead mb-4">We trace every jar back to its hive.</p>
        <!-- Temporary: points to No data found until search is wired up; switch back to map.html later -->
        <a class="btn btn-primary btn-lg" href="not-found.html">Find your honey</a>
      </div>

      <div class="home-map">
        <!-- Placeholder map until the mapping provider is chosen.
             map-pin = exact hive location; map-area = approximate area the keeper chose to share. -->
        <div class="map-box" role="img" aria-label="Map of certified hives">
          <form class="map-search" role="search">
            <label class="visually-hidden" for="mapSearch">Search this map</label>
            <input class="form-control" id="mapSearch" type="search" placeholder="Search this map">
          </form>
          <span class="map-pin" style="left: 62%; top: 38%" title="Sunrise Farm"></span>
          <span class="map-area" style="left: 38%; top: 55%" title="Maple Ridge Apiary"></span>
          <span class="map-pin" style="left: 78%; top: 66%" title="Clover Hill"></span>
          <div class="map-legend">
            <span><i class="key-pin"></i>Exact hive</span>
            <span><i class="key-area"></i>Approximate area</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
</body>
</html>
