<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No data found · Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="images/honey-tracker-logo.png" alt="" class="brand-logo"> Honey Tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="marketplace.html">Marketplace</a></li>
          <li class="nav-item"><a class="nav-link" href="learn.html">Learn</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" href="signin.html">Sign in</a>
          <a class="btn btn-primary" href="get-started.html">Get started</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Shown when a searched or scanned honey isn't in the system.
       The searched name fills the eyebrow line, e.g. not-found.html?q=Big+Name+Honey -->
  <main class="container empty-state">
    <i class="bi bi-question-diamond empty-icon d-block mb-3" aria-hidden="true"></i>
    <p class="eyebrow mb-2" id="searchedName" hidden></p>
    <h1 class="mb-3">Well, that's un-bee-lievable.</h1>
    <p class="lead mb-4">We don't have the scoop on this honey yet.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-primary" href="marketplace.html">Browse certified honey</a>
      <a class="btn btn-outline-secondary" href="map.html">Explore the map</a>
    </div>
  </main>
  <script>
    // Show what the person searched for, e.g. "Big Name Honey?"
    const q = new URLSearchParams(location.search).get('q');
    if (q) {
      const el = document.getElementById('searchedName');
      el.textContent = q + '?';
      el.hidden = false;
    }
  </script>

  <footer class="site-footer mt-5">
    <div class="container py-4 d-flex flex-wrap gap-3 justify-content-between">
      <span>&copy; 2026 Honey Tracker</span>
      <nav class="d-flex flex-wrap gap-3" aria-label="Footer">
        <a href="#">About</a>
        <a href="learn.html">Learn</a>
        <a href="get-started.html">Become a keeper</a>
        <a href="volunteer.html">Volunteer</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </footer>

  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
</body>
</html>
